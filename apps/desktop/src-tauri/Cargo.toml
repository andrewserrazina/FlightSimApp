[package]
name = "flightsim-desktop"
version = "0.1.0"
description = "FlightSimApp desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "flightsim_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "net", "time", "sync", "macros", "rt-multi-thread", "fs"] }
getrandom = "0.2"
base64 = "0.22"
# SQLite compiled in (no system library needed on Windows). Used only by the local flight store.
rusqlite = { version = "0.32", features = ["bundled"] }
# OS secure credential storage (Windows Credential Manager, macOS Keychain, Linux kernel keyring).
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# GSX receipt parsing (S2-05): a non-executing HTML tree (html5ever) and the duplicate-content hash.
# Both are already in the lock file through Tauri; no new third-party code.
dom_query = "0.28"
sha2 = "0.10"
# GSX receipt watcher (S2-06): file-system change notifications, used only as hints; periodic
# reconciliation scans stay authoritative. macOS FSEvents backend disabled (kqueue instead).
notify = { version = "6.1.1", default-features = false, features = ["macos_kqueue"] }

chrono = "0.4"
# Native-only HTTPS client; API keys never enter webview or browser networking.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[profile.release]
strip = true
lto = true
